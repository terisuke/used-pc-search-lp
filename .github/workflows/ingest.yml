name: ingest

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      committed: ${{ steps.data.outputs.committed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ingest.mjs
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - id: data
        run: |
          if git diff --quiet data/; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): auto-ingest $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: ingest
    if: needs.ingest.outputs.committed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages # deploy.yml と共有 — 二重deploy競合を直列化
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: deployment
        uses: actions/configure-pages@v5
      - name: bust asset cache
        run: |
          sed -i "s|assets/js/app.js|assets/js/app.js?v=${GITHUB_SHA:0:8}|g; s|assets/css/app.css|assets/css/app.css?v=${GITHUB_SHA:0:8}|g" index.html
      - name: assemble site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp -r assets/. _site/assets/
          cp data/latest.json data/spec-review-latest.json data/spec-review-latest.md data/worker-config.json _site/data/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
